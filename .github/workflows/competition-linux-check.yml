name: Competition Linux check

on:
  push:
    branches: [codex/linux-evaluation-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Linux build environment
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5
          df -h .
          free -h
      - uses: ./.github/actions/setup-rust
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: deps/3rd
          key: competition-linux-deps-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
      - name: Initialize dependencies and CMake
        run: |
          set -o pipefail
          ./build.sh release --init 2>&1 | tee linux-configure.log
      - name: Analyze Bazel production target
        run: |
          set -o pipefail
          curl -fL --retry 3 https://releases.bazel.build/8.2.1/release/bazel-8.2.1-linux-x86_64 -o /tmp/bazel-8.2.1
          chmod +x /tmp/bazel-8.2.1
          /tmp/bazel-8.2.1 build --nobuild //src/observer:seekdb_link 2>&1 | tee linux-bazel-analysis.log
      - name: Stage the previously submitted worker for comparison
        run: git show be3d5a70e:src/observer/mysql/ai_column_sql_rewriter.h > src/observer/mysql/ai_column_sql_rewriter.h
      - name: Compile previous release binary
        run: |
          set -o pipefail
          cmake --build build_release --target seekdb -j3 2>&1 | tee linux-build.log
          build_release/src/observer/seekdb --version
      - name: Reproduce AI column regressions before the thread change
        id: baseline
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/script/seekdb/competition_ai_column_check.py baseline 2>&1 | tee linux-ai-column-baseline.log
      - name: Rebuild with the worker thread change
        run: |
          set -o pipefail
          git restore src/observer/mysql/ai_column_sql_rewriter.h
          cmake --build build_release --target seekdb -j3 2>&1 | tee linux-build-worker-fix.log
      - name: Run AI column regression on Linux
        run: |
          set -o pipefail
          python3 .github/script/seekdb/competition_ai_column_check.py fixed 2>&1 | tee linux-ai-column-fixed.log
      - name: Save reusable Linux runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ai-column-runtime
          retention-days: 2
          path: |
            build_release/src/observer/seekdb
            deps/3rd/u01/obclient/
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-diagnostics
          path: |
            linux-*.log
            linux-ai-column-*/
          retention-days: 5
