name: MiniVectorDB validation
on:
  push:
    branches: ['codex/mini-vector-db', '2026-competition-round2']
    paths: ['minivectordb/**', 'tests/**', 'Dockerfile', 'requirements.txt', '.github/workflows/minivectordb-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Database regression tests
        run: python -m pytest -q tests
      - name: Build submission image
        run: docker build -t minivectordb:submission .
      - name: Official public protocol and SQL checks
        run: python protocol_check/run.py --image minivectordb:submission --output results/linux-public
      - name: Data exceeds container memory and survives restart
        run: python tests/resource_probe.py --image minivectordb:submission --output results/linux-resource
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minivectordb-validation
          path: results/
